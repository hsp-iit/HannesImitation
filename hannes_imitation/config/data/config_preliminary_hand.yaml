# config.yaml

directory:
  # input directory containing all the episodes in different files
  source: '/home/calessi-iit.local/Projects/pyHannesAPI/dataset/preliminary/'
  # output directory containing the merged episodes
  destination: '/home/calessi-iit.local/Projects/hannes-imitation/data/preliminary/'
  # output filename of the merged episodes
  merged_name: 'merged.zarr' 

scaling_factor: 0.2 # scaling factor of images

# this is to instantiate a dictionary containing the merged episodes.
# the dictionary will be filled inside merge_demonstration.py
# 'data' contains both observations and actions.
# 'meta' must contain the array indicating episode ends.
merged_data:
    'data': 
      'image_in_hand': [] 
      'ref_move_hand': [] 
    'meta':
      'episode_ends': []